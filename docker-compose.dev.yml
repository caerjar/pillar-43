services:
  api:
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./api:/app
      - ${LIBRARY_ROOT}:/library:ro
      - ${NOTES_PATH}:/notes
      - ${GENERATED_PATH}:/generated

  web:
    # The prod image's final stage is nginx serving a built bundle — it has no
    # npm. Dev needs the node build stage (toolchain + node_modules + source).
    build:
      target: build
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./web:/app
      - /app/node_modules

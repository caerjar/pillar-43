name: Release

# Fires on a version tag. The TAG IS THE VERSION — nothing in the repo stores
# it, so there is no second copy to drift. (api/main.py and web/package.json
# used to hold hand-maintained versions that had already disagreed: 0.1.0 vs
# 0.0.1, with no release to anchor either.)
#
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0
#
# See RELEASING.md for the full procedure and the pre-flight checks.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to GHCR

jobs:
  # Refuse to publish something the normal gates have not passed. A tag can be
  # pushed to any commit, including one that never went through a PR, so this
  # is not redundant with the CI workflow.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Derive version from the tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG must document this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section."
            echo "A release with no changelog entry is a release nobody can read."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - working-directory: api
        run: mypy --config-file mypy.ini .
      - working-directory: api
        run: |
          TESTING=1 \
          LIBRARY_ROOT=/tmp/vault \
          NOTES_PATH=/tmp/active \
          GENERATED_PATH=/tmp/generated \
          pytest -q -n auto --cov --cov-report=term:skip-covered

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx tsc --noEmit
      - working-directory: web
        run: npx eslint src --max-warnings=11
      - working-directory: web
        run: npx vitest run --coverage

  images:
    name: Build and push ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the owner: GHCR rejects uppercase in a repository path, and
      # GitHub usernames may contain it.
      - id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/pillar43-${{ matrix.service }}
          # Full version, minor series, and `latest`. Someone pinning
          # :0.2 gets patches without re-pinning; someone pinning :0.2.1
          # gets exactly what they tested.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          # Explicit, never defaulted: api has a `dev` stage LAST,
          # and Docker builds the last stage unless told otherwise — that is
          # exactly how the test toolchain previously shipped to production.
          # Both Dockerfiles (api, web) name their production stage `runtime`.
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PILLAR43_VERSION=${{ needs.verify.outputs.version }}
            PILLAR43_API_SHA=${{ github.sha }}
            PILLAR43_WEB_SHA=${{ github.sha }}
            PILLAR43_GIT_SHA=${{ github.sha }}
            PILLAR43_BUILT_AT=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    name: Publish the GitHub Release
    needs: [verify, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract this version's CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          # From the version heading to the next `## [` heading, exclusive.
          awk -v v="## [${version}]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/     { exit }
            on                 { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::Extracted release notes are empty for ${version}."
            exit 1
          fi
          echo "--- notes ---"; cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          # A suffix (v0.3.0-rc.1) marks a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Notes only — the artifacts are the GHCR images, not tarballs here.
          make_latest: ${{ !contains(github.ref_name, '-') }}

name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Pillar-43 is self-hosted and unauthenticated by design. If you have found
        a **security** issue, please do not file it here — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Opened the Maintain panel
        2. Clicked "Run catalog"
        3. Expected progress events; the panel stayed empty
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        `docker compose logs api --tail=100` and, for UI issues, the browser
        console. Redact anything vault-specific you would rather not share.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA, or the build stamp shown in Settings.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 15.2, Docker Desktop 27.4"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I rebuilt after pulling (`docker compose up --build -d`)
          required: true
        - label: I checked `docker compose ps` shows all services running
          required: true

[mypy]
python_version = 3.12
ignore_missing_imports = True
# Generated Alembic migrations, the test suite, one-off scripts, and the
# test-only host_root bind-mount are not part of the typed surface.
exclude = (?x)(^migrations/ | ^tests/ | ^scripts/ | ^host_root/)
# Pragmatic gate: catch real type errors (None-safety, bad indexing, wrong
# returns) in already-clean modules — NOT a boil-the-ocean strict pass. Do
# not require annotations everywhere; tighten incrementally.
check_untyped_defs = False
warn_unused_ignores = False
warn_redundant_casts = True

# ── Type-debt allowlist (SHRINK me) ──────────────────────────────────────────
# Modules that still fail the lenient config above. The gate ignores them so it
# is green today while type-checking every OTHER module. To retire an entry:
# delete its block, run `./scripts/mypy-api`, fix what it reports.
# New code should NOT be added to this list.
#
# 25 modules (2026-07-24) -> 20 (2026-08-05). The five retired were the five
# smallest, and between them they hid two genuine bugs rather than mere
# missing annotations:
#   - routes/catalog/passes/threads.py imported a function that has never
#     existed, inside a try/except, so POST /threads/regenerate returned 500
#     unconditionally. Endpoint deleted (nothing called it; the one frontend
#     client method disagreed with its signature and had zero callers).
#   - routes/history.py passes active_root=None for non-git mounts by design,
#     but get_file_history fell through to the git path anyway when the
#     checkpoint table was empty. Guarded, with a regression test.
# Worth remembering next time this list looks like cosmetic debt.
#
# 20 -> 8 (2026-08-07). Twelve more retired, and almost none of it was work on
# the modules themselves:
#   - services/catalog/orchestrator.py had ZERO errors. It was exempt for no
#     reason anyone recorded. Free.
#   - routes/ai_helpers.py had 19 errors from ONE cause: `gather_folder_context`
#     guards on `top_level` (a bool) rather than on `_state is None`, so every
#     later subscript saw `dict | None`. Narrowing on the value instead of the
#     flag cleared all 19 and reads better.
#   - Five modules were exempt only because `types-PyYAML` and `types-requests`
#     were missing from requirements-dev.txt. One dependency line retired all
#     five; their own code was already clean.
# The rest were one annotation each.
#
# Remaining blocks: search, catalog scan, transcription.

[mypy-routes.search]
ignore_errors = True

[mypy-services.catalog.scan]
ignore_errors = True

[mypy-services.transcription]
ignore_errors = True

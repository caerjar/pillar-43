[pytest]
asyncio_mode = auto
testpaths = tests

# Markers. Both are excluded by `./scripts/test-api-fast`.
#
# - slow: >= 2.0s per test, measured serially. The threshold is per-test, not
#   per-module: 2s is already the long tail here, and a module-scope number
#   would have missed the two single-test cases below.
# - integration: needs a real external service or binary. Defined structurally,
#   NOT by duration — a test is integration if it would touch something real
#   absent its mocks.
#
# Apply with `@pytest.mark.slow` / `@pytest.mark.integration` on a function or
# `pytestmark = pytest.mark.slow` at module top. Prefer per-test unless the
# slowness is broad across the module.
#
# ── Measured 2026-08-05 (`./scripts/test-api --no-reuse -n 1 --durations=0`;
#    -n 1 is essential — under -n auto the durations are contended and
#    unusable for thresholding). Re-measure before trusting these numbers.
#
#   36 of 1297 tests deselected → fast subset runs 1261 in ~25s vs ~48s full.
#
#   slow (12):
#     tests/test_catalog_speed.py                      32.6s / 10 tests (module)
#     test_sources_google_drive.py::test_concurrent_…   5.0s  (semaphore timeout)
#     test_ai_client.py::test_with_retry_exhausts_…     5.0s  (backoff schedule)
#
#   integration (24): test_daily_recap.py, test_recap.py,
#     test_git_history_batched.py — all shell out to the real `git` binary and
#     build repositories on disk. No test in this suite requires live network;
#     every provider call is mocked.
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests that require a live external service
    real_gate: runs against the real access gate (the conftest opens it for other modules)

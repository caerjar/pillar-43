# Runtime server for the built SPA. Replaces `vite preview`, which shipped the
# whole toolchain (485 MB of node_modules) into the running image and made Vite
# itself the production HTTP server — see the 2026-07-30 audit.
#
# Two jobs: serve dist/ with SPA fallback, and proxy /api to the api container
# exactly as vite.config.ts's `preview.proxy` did.

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client uploads (attachments, images) — the api enforces its own 10 MB
    # content cap; keep nginx from rejecting first with a less useful error.
    client_max_body_size 12m;

    # SPA: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # users keep booting a stale bundle after an upgrade.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        # Resolve `api` per request instead of once at startup.
        #
        # With a literal upstream, nginx resolves the name when it loads the
        # config and caches that IP for the life of the worker. Recreate the
        # api container — which `docker compose up --build -d` does on every
        # backend change — and it comes back on a different address while nginx
        # keeps dialling the old one: every request 502s with "Host is
        # unreachable" and the app hangs on "Starting Pillar-43…" even though
        # the backend is healthy and reachable by name from this very container.
        # Observed on 2026-08-18 after the stack dropped from five services to
        # two; the churn made a latent bug reliable.
        #
        # 127.0.0.11 is Docker's embedded DNS. Putting the upstream in a
        # variable is what forces nginx to consult the resolver per request
        # rather than baking it in — and because a variable proxy_pass does not
        # carry the matched URI, $request_uri has to be appended explicitly.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;

        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        # nginx defaults Host to $proxy_host ("api"), which is what
        # `changeOrigin: true` did in the vite proxy — and what the backend's
        # TrustedHostMiddleware allowlist expects (ALLOWED_HOSTS=api).
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE is load-bearing here (catalog runs, AI streaming, Maintain).
        # Buffering would hold events until the response closed, turning every
        # live progress stream into a single dump at the end.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # Long-running passes stream for minutes; the 60s default would cut them.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
